name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad · ruff · mypy · tests · consistencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2  # sin tag mayor móvil `v8`; se fija la versión

      - name: Install dependencies (sin pesos ni CUDA)
        run: |
          uv venv
          uv pip install --quiet \
            numpy>=1.26 scipy>=1.11 \
            torch>=2.1 torchvision>=0.16 --index-strategy unsafe-best-match \
            matplotlib>=3.8 opencv-python-headless>=4.8 trimesh>=4.0 \
            pyyaml tqdm pillow scikit-learn \
            fastapi "uvicorn[standard]" pydantic requests \
            transformers coppeliasim-zmqremoteapi-client \
            ruff mypy pytest>=8.0
          uv pip install --quiet -e packages/bop_bootstrap_ci

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Type check (mypy)
        run: |
          source .venv/bin/activate
          set -o pipefail
          mkdir -p reports
          mypy src scripts dashboard.py packages/bop_bootstrap_ci/src | tee reports/mypy.txt

      - name: Tests (TFM + paquete PyPI)
        run: |
          source .venv/bin/activate
          # Los tests `integration` se omiten solos: no hay CoppeliaSim en el runner.
          pytest tests/ -q --junitxml=reports/tests.xml
          pytest packages/bop_bootstrap_ci/tests/ -q --junitxml=reports/paquete.xml
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Consistencia del TFM (garantía)
        run: |
          source .venv/bin/activate
          set -o pipefail
          python scripts/verify_tfm_consistency.py | tee reports/consistencia.txt

      - name: Cifras publicadas = cifras medidas
        run: |
          source .venv/bin/activate
          python scripts/check_public_counts.py reports/

  docker:
    name: Build imagen Docker (API + dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (sin push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: tfm-pose6dof-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
